<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | SocioVerse</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"><link rel="stylesheet" href="style.css"></head>
<body><div class="auth-wrap"><form class="auth-card" id="f"><h1 class="gradtxt">SocioVerse</h1><p class="sub">Welcome back! Login to continue.</p>
<div class="fg"><label>Username or Email</label><input id="identifier" required autocomplete="username"></div>
<div class="fg"><label>Password</label><input id="password" type="password" required autocomplete="current-password"><button type="button" class="eye" data-eye><i class="fas fa-eye"></i></button></div>
<label class="check"><input type="checkbox" id="remember"> Remember me</label><div class="err" id="err"></div><button class="btn" id="btn">Login</button>
<p class="auth-link"><a href="reset.html">Forgot password?</a></p><p class="auth-link">New here? <a href="register.html">Create account</a></p></form></div><div class="toasts" id="toasts"></div><script src="auth.js"></script></body></html>
