<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register | SocioVerse</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"><link rel="stylesheet" href="style.css"></head>
<body><div class="auth-wrap"><form class="auth-card" id="f" style="max-width:560px"><h1 class="gradtxt">Join SocioVerse</h1><p class="sub">Create your account in a minute.</p>
<div class="row2"><div class="fg"><label>Full Name *</label><input id="fullName" required></div><div class="fg"><label>Username *</label><input id="username" required></div></div>
<div class="fg"><label>Email *</label><input id="email" type="email" required></div>
<div class="row2"><div class="fg"><label>Country *</label><select id="country"><option value="PK">Pakistan</option><option value="IN">India</option><option value="US">United States</option><option value="GB">United Kingdom</option><option value="AE">UAE</option><option value="SA">Saudi Arabia</option><option value="OT">Other</option></select></div><div class="fg"><label>Phone</label><input id="phone" placeholder="03XXXXXXXXX"></div></div>
<div class="row2"><div class="fg"><label>Gender</label><select id="gender"><option>Male</option><option>Female</option><option>Other</option></select></div><div class="fg"><label>Date of Birth * (18+)</label><input id="dob" type="date" required></div></div>
<div class="row2"><div class="fg"><label>Password *</label><input id="password" type="password" required minlength="6"><button type="button" class="eye" data-eye><i class="fas fa-eye"></i></button></div><div class="fg"><label>Confirm Password *</label><input id="confirm" type="password" required></div></div>
<div class="err" id="err"></div><button class="btn" id="btn">Create Account</button><p class="auth-link">Already registered? <a href="login.html">Login</a></p></form></div><div class="toasts" id="toasts"></div><script src="auth.js"></script></body></html>
