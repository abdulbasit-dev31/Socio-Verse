<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Password | SocioVerse</title>

<body><div class="auth-wrap"><form class="auth-card" id="f"><h1 class="gradtxt" id="title">Forgot Password</h1><p class="sub" id="sub">Enter your email to get a reset link.</p>
